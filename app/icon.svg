  <circle cx="16" cy="16" r="14" fill="#011a11" stroke="#b8e756" stroke-width="1.4"/>
  <path d="M16 5.5 17.9 14.1 26.5 16 17.9 17.9 16 26.5 14.1 17.9 5.5 16 14.1 14.1Z" fill="#b8e756"/>
</svg>
