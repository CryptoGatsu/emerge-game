name: Repair citizen movement

# Triggered after the workflow is installed so the movement repair is applied.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-movement]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch simulation
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/simulation.ts')
          s = p.read_text()
          old_move = """function moveCitizens(world:World,hours:number){const rand=mulberry32(world.seed+world.day*997+Math.floor(world.hour*17));const market=world.buildings.find(b=>b.type==='Market');const tavern=world.buildings.find(b=>b.type==='Tavern');for(const c of world.citizens){const home=world.buildings.find(b=>b.id===world.families.find(f=>f.id===c.familyId)?.homeId);if(c.age<16)c.job='unemployed';const hash=[...c.id].reduce((n,ch)=>n+ch.charCodeAt(0),0);const night=world.hour>=21||world.hour<6;const socialTime=world.hour>=18&&world.hour<21;const hourSlot=Math.floor(world.hour);const roamNode=(hash+world.day+Math.floor(hourSlot/2))%roadNodes.length;const roam={id:`roam-${c.id}`,x:roadNodes[roamNode][0],y:roadNodes[roamNode][1]};let target:any=roam,activity:Activity='walking';if(c.hunger<42&&market){target=market;activity='eating';}else if(night&&home){target=home;activity='resting';}else if(socialTime&&tavern){target=tavern;activity='trading';}else{const workplace=jobBuilding(world,c);const workWindow=((hourSlot+hash)%3===0);if(workplace&&workWindow){target=workplace;activity='working';}else{target=roam;activity='walking';}}c.targetBuildingId=target.id.startsWith('roam-')?undefined:target.id;c.inside=false;const dist=Math.hypot(target.x-c.x,target.y-c.y);const speed=(c.age<16?5.2:8.5)*hours;if(dist>2.2){const start=nearestRoad(c.x,c.y),end=nearestRoad(target.x,target.y),path=roadPath(start,end);const onRoad=Math.hypot(roadNodes[start][0]-c.x,roadNodes[start][1]-c.y)<10;let tx=target.x,ty=target.y;if(path.length>1&&onRoad){const next=path[1];tx=roadNodes[next][0];ty=roadNodes[next][1];}else if(path.length>1&&dist>10){tx=roadNodes[start][0];ty=roadNodes[start][1];}const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy)||1,step=Math.min(d,speed);c.x=Math.max(4,Math.min(96,c.x+dx/d*step));c.y=Math.max(6,Math.min(94,c.y+dy/d*step));c.activity='walking';}else{c.x=target.x+(rand()-.5)*1.5;c.y=target.y+(rand()-.5)*1.5;c.activity=activity;c.inside=!!c.targetBuildingId&&(activity==='working'||activity==='resting'||activity==='trading'||activity==='eating');}if(c.activity==='trading'&&c.wallet>4&&rand()>.35)c.wallet-=2;}}"""
          new_move = """function moveCitizens(world:World,hours:number){const rand=mulberry32(world.seed+world.day*997+Math.floor(world.hour*17));const market=world.buildings.find(b=>b.type==='Market');const tavern=world.buildings.find(b=>b.type==='Tavern');for(const c of world.citizens){const home=world.buildings.find(b=>b.id===world.families.find(f=>f.id===c.familyId)?.homeId);if(c.age<16)c.job='unemployed';const hash=[...c.id].reduce((n,ch)=>n+ch.charCodeAt(0),0);const night=world.hour>=21||world.hour<6;const socialTime=world.hour>=18&&world.hour<21;const hourSlot=Math.floor(world.hour);const roamNode=(hash+world.day+Math.floor(hourSlot/2))%roadNodes.length;const roam={id:`roam-${c.id}`,x:roadNodes[roamNode][0],y:roadNodes[roamNode][1]};let target:any=roam,activity:Activity='walking';if(c.hunger<42&&market){target=market;activity='eating';}else if(night&&home){target=home;activity='resting';}else if(socialTime&&tavern){target=tavern;activity='trading';}else{const workplace=jobBuilding(world,c);const workWindow=((hourSlot+hash)%3===0);if(workplace&&workWindow){target=workplace;activity='working';}else{target=roam;activity='walking';}}c.targetBuildingId=target.id.startsWith('roam-')?undefined:target.id;c.inside=false;const dist=Math.hypot(target.x-c.x,target.y-c.y);const speed=(c.age<16?5.2:8.5)*hours;if(dist>2.2){const start=nearestRoad(c.x,c.y),end=nearestRoad(target.x,target.y),path=roadPath(start,end);const onRoad=Math.hypot(roadNodes[start][0]-c.x,roadNodes[start][1]-c.y)<10;let tx=target.x,ty=target.y;if(path.length>1&&onRoad){const next=path[1];tx=roadNodes[next][0];ty=roadNodes[next][1];}else if(path.length>1&&dist>10){tx=roadNodes[start][0];ty=roadNodes[start][1];}const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy)||1,step=Math.min(d,speed);c.x=Math.max(4,Math.min(96,c.x+dx/d*step));c.y=Math.max(6,Math.min(94,c.y+dy/d*step));c.activity='walking';}else{c.x=target.x+(rand()-.5)*1.5;c.y=target.y+(rand()-.5)*1.5;c.activity=activity;c.inside=!!c.targetBuildingId&&(activity==='working'||activity==='resting'||activity==='trading'||activity==='eating');}if(c.activity==='trading'&&c.wallet>4&&rand()>.35)c.wallet-=2;}}"""
          if old_move not in s: raise SystemExit('Movement patch not applied to expected source')
          s=s.replace(old_move,new_move,1)
          old_jobs="""function chooseJob(world:World,_c:Citizen):WorkingJob{const a:WorkingJob[]=['farmer','woodcutter','miner','quarry','miller','baker','carpenter','blacksmith','tailor'];return a.map(j=>({j,s:jobScore(world,j)})).sort((a,b)=>b.s-a.s)[0].j;}"""
          new_jobs="""function chooseJob(world:World,_c:Citizen):WorkingJob{const available=(Object.keys(jobs) as WorkingJob[]).filter(j=>world.buildings.some(b=>b.type===jobs[j].building));const a=available.length?available:['farmer'];return a.map(j=>({j,s:jobScore(world,j)})).sort((a,b)=>b.s-a.s)[0].j;}"""
          if old_jobs in s: s=s.replace(old_jobs,new_jobs,1)
          old_create="""const buildings:Building[]=[{id:'bank',type:'Bank',x:24,y:24,workers:[],active:true},{id:'market',type:'Market',x:29,y:24,workers:[],active:true},{id:'storage',type:'Storage',x:34,y:24,workers:[],active:true},{id:'tavern',type:'Tavern',x:42,y:43,workers:[],active:true}];"""
          new_create="""const buildings:Building[]=[{id:'bank',type:'Bank',x:24,y:24,workers:[],active:true},{id:'market',type:'Market',x:29,y:24,workers:[],active:true},{id:'storage',type:'Storage',x:34,y:24,workers:[],active:true},{id:'tavern',type:'Tavern',x:42,y:43,workers:[],active:true},{id:'farm0',type:'Farm',x:38,y:24,workers:[],active:true},{id:'wood0',type:'Woodcutter',x:54,y:24,workers:[],active:true},{id:'mine0',type:'Mine',x:68,y:30,workers:[],active:true},{id:'quarry0',type:'Quarry',x:76,y:46,workers:[],active:true},{id:'mill0',type:'Mill',x:58,y:55,workers:[],active:true},{id:'bakery0',type:'Bakery',x:70,y:58,workers:[],active:true}];"""
          if old_create not in s: raise SystemExit('Building seed patch not applied to expected source')
          s=s.replace(old_create,new_create,1).replace('treasury:1000,population:count','treasury:3000,population:count',1)
          p.write_text(s)
      - name: Improve citizen visibility
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/globals.css'); s=p.read_text()
          s=s.replace('.citizen{position:absolute;z-index:6;width:11px;height:11px;','.citizen{position:absolute;z-index:6;width:15px;height:15px;')
          s=s.replace('.citizen span{display:block;width:9px;height:9px;','.citizen span{display:block;width:11px;height:11px;')
          if 'citizenPulse' not in s: s += '\n.citizen.walking{filter:drop-shadow(0 0 5px #69df92)}\n.citizen.walking span{animation:walk .38s steps(2) infinite,citizenPulse 1.2s ease-in-out infinite}\n@keyframes citizenPulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.18)}}\n'
          p.write_text(s)
      - name: Commit repaired movement
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/simulation.ts app/globals.css
          git commit -m '[auto-movement] Make citizens visibly roam and commute'
          git push