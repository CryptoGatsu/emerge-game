name: Fix AI visibility and roads
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fix
        run: node scripts/fix-ai-visibility.js
      - name: Build
        run: npm ci && npm run build
      - name: Commit fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/globals.css scripts/fix-ai-visibility.js .github/workflows/fix-ai-visibility-roads.yml .github/emerge-fix-trigger.txt
          git commit -m "Fix AI visibility, tooltips, and road presentation"
          git push
          git rm scripts/fix-ai-visibility.js .github/workflows/fix-ai-visibility-roads.yml .github/emerge-fix-trigger.txt
          git commit -m "Remove one-time AI visibility repair"
          git push
