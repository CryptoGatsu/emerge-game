name: Fix map view and graphics
on:
  push:
    branches: [main]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auto-map]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch map UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()

          # Remove duplicate inspector state/render introduced by the previous patch.
          s=s.replace("const [paused,setPaused]=useState(false);const [selected,setSelected]=useState<'overview'|'bank'|'market'|'build'>('overview');const [speed,setSpeed]=useState(1);const [marketFocus,setMarketFocus]=useState<Resource>('wheat');const [inspected,setInspected]=useState<{kind:'citizen'|'building';id:string}|null>(null);const [inspected,setInspected]=useState<{kind:'citizen'|'building';id:string}|null>(null);", "const [paused,setPaused]=useState(false);const [selected,setSelected]=useState<'overview'|'bank'|'market'|'build'>('overview');const [speed,setSpeed]=useState(1);const [marketFocus,setMarketFocus]=useState<Resource>('wheat');const [inspected,setInspected]=useState<{kind:'citizen'|'building';id:string}|null>(null);const [view,setView]=useState({x:0,y:0,zoom:1});const drag=useState<{x:number;y:number;ox:number;oy:number}|null>(null)[0];")

          # Replace the drag state with a ref-safe implementation using a normal state pair.
          s=s.replace("const [view,setView]=useState({x:0,y:0,zoom:1});const drag=useState<{x:number;y:number;ox:number;oy:number}|null>(null)[0];", "const [view,setView]=useState({x:0,y:0,zoom:1});const [drag,setDrag]=useState<{x:number;y:number;ox:number;oy:number}|null>(null);")

          old="const market=world.buildings.find(b=>b.type==='Market');"
          new="const market=world.buildings.find(b=>b.type==='Market');const beginPan=(e:React.PointerEvent<HTMLDivElement>)=>{if(e.button!==0)return;e.currentTarget.setPointerCapture(e.pointerId);setDrag({x:e.clientX,y:e.clientY,ox:view.x,oy:view.y});};const pan=(e:React.PointerEvent<HTMLDivElement>)=>{if(!drag)return;setView(v=>({...v,x:drag.ox+(e.clientX-drag.x),y:drag.oy+(e.clientY-drag.y)}));};const endPan=()=>setDrag(null);const zoom=(delta:number)=>setView(v=>({...v,zoom:Math.max(.65,Math.min(2.2,Number((v.zoom+delta).toFixed(2))))}));const resetView=()=>setView({x:0,y:0,zoom:1});"
          s=s.replace(old,new)

          old='<div className="map"><div className="maplabel">LIVE WORLD'
          new='<div className={`map ${drag?"panning":""}`} onPointerDown={beginPan} onPointerMove={pan} onPointerUp={endPan} onPointerCancel={endPan} onWheel={e=>{e.preventDefault();zoom(e.deltaY>0?-.08:.08)}}><div className="maplabel">LIVE WORLD'
          s=s.replace(old,new)

          marker='<div className="weatherbadge"><span>{weatherIcon[world.weather]}</span><b>{world.weather}</b><small>{world.season}</small></div>'
          s=s.replace(marker, marker+'<div className="mapcontrols"><button onPointerDown={e=>e.stopPropagation()} onClick={()=>zoom(.12)}>+</button><button onPointerDown={e=>e.stopPropagation()} onClick={()=>zoom(-.12)}>−</button><button onPointerDown={e=>e.stopPropagation()} onClick={resetView}>⌂</button><span>{Math.round(view.zoom*100)}%</span></div><div className="maphint">DRAG TO PAN · SCROLL TO ZOOM</div><div className="mapstage" style={{transform:`translate3d(${view.x}px,${view.y}px,0) scale(${view.zoom})`}}>' )

          marker='<div className="maplegend"><span><b className="dot citizen-dot"/> CITIZENS</span>'
          s=s.replace(marker,'</div><div className="maplegend"><span><b className="dot citizen-dot"/> CITIZENS</span>')

          # Remove accidental duplicate inspector render and ensure one remains.
          dup='{inspected&&<Inspector world={world} inspected={inspected} onClose={()=>setInspected(null)}/> }{inspected&&<Inspector world={world} inspected={inspected} onClose={()=>setInspected(null)}/> }'
          s=s.replace(dup,'{inspected&&<Inspector world={world} inspected={inspected} onClose={()=>setInspected(null)}/> }')

          p.write_text(s)

          p=Path('app/globals.css')
          s=p.read_text()
          s += '''\n.map{touch-action:none;cursor:grab;background:#172c1d;isolation:isolate}.map.panning{cursor:grabbing}.mapstage{position:absolute;inset:0;transform-origin:center center;transition:transform .12s ease-out;will-change:transform}.mapstage>*{transition:filter .2s ease}.mapstage .terrainbg{inset:-8%;width:116%;height:116%;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(12,1fr);filter:saturate(1.08) contrast(1.04)}.terrainbg span{border-right:1px solid #ffffff08;border-bottom:1px solid #ffffff08;box-shadow:inset 0 0 20px #00000012}.terrainbg .grass{background:radial-gradient(circle at 25% 20%,#2b5a36,#183b24 70%)}.terrainbg .meadow{background:radial-gradient(circle at 65% 35%,#3b7040,#244c2d 72%)}.terrainbg .brush{background:radial-gradient(circle at 40% 65%,#3b633d,#1d4029 72%)}.terrainbg .foresttile{background:radial-gradient(circle at 45% 40%,#245d35,#102f20 75%)}.terrainbg .rocktile{background:linear-gradient(145deg,#566159,#323c37 55%,#262e2a)}.terrainbg .soil{background:linear-gradient(145deg,#685139,#49351f 65%,#392a1b)}.terrainbg .pathgrass{background:linear-gradient(135deg,#3a6040,#2b4d32)}.roads path{stroke:#c7ae7a77;stroke-width:2.2;filter:drop-shadow(0 0 2px #0009)}.roads path:first-child{stroke:#d6bd8a99}.building{width:40px;height:40px;border-radius:8px;background:linear-gradient(145deg,#b18b58,#6d5435 65%,#4e3b27);border-color:#d9b975;box-shadow:0 6px 14px #000b,0 0 0 1px #f2d69a22;overflow:visible}.building:after{content:"";position:absolute;left:5px;right:5px;top:4px;height:10px;background:linear-gradient(135deg,#d0aa69,#8a683f);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.9}.building>span{position:relative;z-index:2;text-shadow:0 2px 3px #000b}.building.operating{box-shadow:0 0 0 1px #71ec9955,0 7px 16px #000b,0 0 18px #57d98222}.resource-node{box-shadow:0 8px 18px #000a,inset 0 0 0 1px #ffffff18}.forest-node{background:radial-gradient(circle,#24623a,#12351f)}.rock-node{background:radial-gradient(circle,#69736c,#39413c)}.farm-node{background:radial-gradient(circle,#725b36,#45351f)}.citizen{filter:drop-shadow(0 3px 3px #0008)}.citizen.walking span{box-shadow:0 0 9px #69df92}.mapcontrols{position:absolute;right:14px;bottom:54px;z-index:18;display:flex;align-items:center;gap:4px;background:#0a100de8;border:1px solid #405148;border-radius:7px;padding:4px;box-shadow:0 8px 20px #0008}.mapcontrols button{width:28px;height:28px;border:1px solid #2f4036;background:#142019;color:#cbd9d1;border-radius:5px;font-size:17px;line-height:1;cursor:pointer}.mapcontrols button:hover{background:#1d3024;color:#70e89a}.mapcontrols span{font-size:8px;color:#829188;min-width:34px;text-align:center}.maphint{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);z-index:17;background:#0a100dcf;border:1px solid #314238;color:#84958b;padding:6px 9px;border-radius:5px;font-size:7px;letter-spacing:1px;pointer-events:none;opacity:.8}.map.panning .maphint{opacity:.35}.map:before{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at center,transparent 55%,#06100a44 100%),linear-gradient(180deg,#07110a18,transparent 22%,transparent 78%,#07110a35)}\n'''
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git diff --cached --quiet || git commit -m "[auto-map] Fix map view and improve graphics"
          git push
