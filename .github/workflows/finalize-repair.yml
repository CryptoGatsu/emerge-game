name: Finalize page repair
on:
  push:
    branches: [main]
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[finalize-repair]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize page and remove temporary patch workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()

          state="const [inspected,setInspected]=useState<{kind:'citizen'|'building';id:string}|null>(null);"
          s=re.sub(re.escape(state), '', s)
          s=re.sub(r"(const \[marketFocus,setMarketFocus\]=useState<Resource>\('wheat'\);)", r"\1"+state, s, count=1)

          handler="const market=world.buildings.find(b=>b.type==='Market');const beginPan=(e:React.PointerEvent<HTMLDivElement>)=>{if(e.button!==0)return;e.currentTarget.setPointerCapture(e.pointerId);setDrag({x:e.clientX,y:e.clientY,ox:view.x,oy:view.y});};const pan=(e:React.PointerEvent<HTMLDivElement>)=>{if(!drag)return;setView(v=>({...v,x:drag.ox+(e.clientX-drag.x),y:drag.oy+(e.clientY-drag.y)}));};const endPan=()=>setDrag(null);const zoom=(delta:number)=>setView(v=>({...v,zoom:Math.max(.65,Math.min(2.2,Number((v.zoom+delta).toFixed(2))))}));const resetView=()=>setView({x:0,y:0,zoom:1});"
          s=re.sub(r"const market=world\.buildings\.find\(b=>b\.type==='Market'\);.*?(?=\n return <main)", handler, s, count=1, flags=re.S)

          controls=r'<div className="mapcontrols">.*?</div>'
          hints=r'<div className="maphint">.*?</div>'
          stages=r'<div className="mapstage" style=\{\{transform:`translate3d\(\$\{view\.x\}px,\$\{view\.y\}px,0\) scale\(\$\{view\.zoom\}\)`\}\}>'
          for pat in (controls,hints,stages):
              matches=list(re.finditer(pat,s,re.S))
              for m in reversed(matches[1:]):
                  s=s[:m.start()]+s[m.end():]

          inspector=r'{inspected&&<Inspector world={world} inspected={inspected} onClose={()=>setInspected(null)}/> }'
          s=re.sub(r'(?:'+re.escape(inspector)+r'\s*)+', inspector, s)

          for _ in range(5):
              s=re.sub(r'</div>\s*</div>\s*<div className="maplegend">', '</div><div className="maplegend">', s, count=1)

          p.write_text(s)

          for name in [
              'fix-simulation-job-types.yml',
              'fix-citizen-movement.yml',
              'add-inspector.yml',
              'fix-map-view.yml',
              'repair-page.yml',
              'finalize-repair.yml',
          ]:
              f=Path('.github/workflows')/name
              if f.exists(): f.unlink()
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit final repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "[finalize-repair] Stabilize map UI and remove patch workflows"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; git add app/page.tsx app/globals.css .github/workflows; git commit -m "[finalize-repair] Stabilize map UI and remove patch workflows"; }
            git push --force-with-lease && exit 0
            sleep 3
          done
          exit 1
