name: Fix simulation job types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix simulation Job typing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Job table narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/simulation.ts')
          s = p.read_text()
          s = s.replace("function jobBuilding(world:World,c:Citizen){if(c.job==='unemployed')return undefined;return world.buildings.find(b=>b.type===jobs[c.job].building);}", "function jobBuilding(world:World,c:Citizen){if(c.job==='unemployed')return undefined;const job=jobs[c.job];return world.buildings.find(b=>b.type===job.building);}")
          s = s.replace("c.wage=jobs[c.job].wage;", "const job=jobs[c.job];c.wage=job.wage;")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/simulation.ts
          git diff --cached --quiet || git commit -m 'Fix simulation Job typing'
          git push
