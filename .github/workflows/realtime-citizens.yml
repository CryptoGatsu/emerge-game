name: Realtime citizens
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[realtime-citizens]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix realtime movement and map bounds
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          page=Path('app/page.tsx')
          s=page.read_text()

          old="useEffect(()=>{if(paused)return;const id=setInterval(()=>setWorld(w=>tick(w,speed)),1000);return()=>clearInterval(id)},[paused,speed]);"
          new="useEffect(()=>{if(paused)return;const id=setInterval(()=>setWorld(w=>tick(w,speed*.1)),100);return()=>clearInterval(id)},[paused,speed]);"
          if old not in s:
              raise SystemExit('simulation interval pattern not found')
          s=s.replace(old,new,1)

          old_terrain='<div className="terrainbg">'
          new_terrain='<div className="terrainbg" style={{position:\'absolute\',inset:0,width:\'100%\',height:\'100%\'}}>'
          if old_terrain not in s:
              raise SystemExit('terrain background marker not found')
          s=s.replace(old_terrain,new_terrain,1)

          old_c='className={`citizen ${c.activity} ${c.job===\'unemployed\'?\'idle\':\'\'}`} style={{left:`${c.x}%`,top:`${c.y}%`}}'
          new_c='className={`citizen ${c.activity} ${c.job===\'unemployed\'?\'idle\':\'\'}`} style={{left:`${c.x}%`,top:`${c.y}%`,transition:\'left 90ms linear, top 90ms linear, transform 180ms ease-out\'}}'
          if old_c not in s:
              raise SystemExit('citizen render pattern not found')
          s=s.replace(old_c,new_c,1)
          page.write_text(s)

          css=Path('app/globals.css')
          c=css.read_text()
          c += '''\n\n/* Realtime world rendering: the simulation advances in small slices while the browser paints every frame. */\n.mapstage .terrainbg{display:grid!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;grid-template-columns:repeat(16,1fr)!important;grid-template-rows:repeat(12,1fr)!important;overflow:hidden}\n.mapstage .citizen{transition:left 90ms linear,top 90ms linear,transform 180ms ease-out;will-change:left,top,transform}\n.mapstage .building,.mapstage .resource-node,.mapstage .market-stall{will-change:transform}\n'''
          css.write_text(c)
          PY
      - name: Validate production build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit realtime repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css
          git commit -m '[realtime-citizens] Make citizens move in realtime on full map'
          git push origin HEAD:main
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/realtime-citizens.yml
          git commit -m 'Remove one-time realtime repair workflow'
          git push origin HEAD:main
