name: Fix citizen rendering
on:
  push:
    paths:
      - 'scripts/fix-citizen-rendering.js'
      - '.github/workflows/fix-citizen-rendering.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fix
        run: node scripts/fix-citizen-rendering.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css
          git diff --cached --quiet || git commit -m 'Fix citizen render layer and walking visibility'
          git push
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Remove repair files
        run: |
          rm -f scripts/fix-citizen-rendering.js .github/workflows/fix-citizen-rendering.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove one-time citizen rendering workflow'
          git push
