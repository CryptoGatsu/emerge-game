name: Fix map coordinate system
on:
  push:
    branches: [fix/map-coordinate-system]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix map coordinate space and realtime motion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          page=Path('app/page.tsx')
          s=page.read_text()
          s=s.replace("tick(w,speed*.1)),100);", "tick(w,speed*.05)),50);", 1)
          page.write_text(s)

          css=Path('app/globals.css')
          c=css.read_text()
          marker='/* HARD MAP COORDINATE SYSTEM */'
          if marker not in c:
              c += '''\n\n/* HARD MAP COORDINATE SYSTEM */\n.mapstage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;transform-origin:center center!important;will-change:transform!important;overflow:visible!important}\n.mapstage .terrainbg{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:grid!important;grid-template-columns:repeat(16,1fr)!important;grid-template-rows:repeat(12,1fr)!important}\n.mapstage .roads{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}\n.mapstage .building,.mapstage .resource-node,.mapstage .market-stall,.mapstage .citizen,.mapstage .trade-particle{position:absolute!important}\n.mapstage .citizen{transition:left 55ms linear,top 55ms linear,transform 120ms ease-out!important;will-change:left,top,transform!important}\n.mapstage .building{will-change:left,top,transform}\n'''
          css.write_text(c)
          PY
      - name: Validate production build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit repaired branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css
          git commit -m '[map-coordinates] Fix world coordinate space and realtime movement'
          git push origin HEAD:fix/map-coordinate-system
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-map-coordinate-system.yml
          git commit -m 'Remove one-time map coordinate workflow'
          git push origin HEAD:fix/map-coordinate-system
