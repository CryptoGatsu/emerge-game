name: Redesign Emerge UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ !contains(github.event.head_commit.message, '[skip-redesign]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch map camera and visual shell
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          s = page.read_text()
          s = s.replace("import { useEffect, useMemo, useState } from 'react';", "import { useEffect, useMemo, useRef, useState } from 'react';")

          old = " const market=world.buildings.find(b=>b.type==='Market');const beginPan=(e:React.PointerEvent<HTMLDivElement>)=>{if(e.button!==0)return;e.currentTarget.setPointerCapture(e.pointerId);setDrag({x:e.clientX,y:e.clientY,ox:view.x,oy:view.y});};const pan=(e:React.PointerEvent<HTMLDivElement>)=>{if(!drag)return;setView(v=>({...v,x:drag.ox+(e.clientX-drag.x),y:drag.oy+(e.clientY-drag.y)}));};const endPan=()=>setDrag(null);const zoom=(delta:number)=>setView(v=>({...v,zoom:Math.max(.65,Math.min(2.2,Number((v.zoom+delta).toFixed(2))))}));const resetView=()=>setView({x:0,y:0,zoom:1});"
          new = " const market=world.buildings.find(b=>b.type==='Market');const mapRef=useRef<HTMLDivElement>(null);const clampView=(x:number,y:number,z:number)=>{const el=mapRef.current;const w=el?.clientWidth??1000;const h=el?.clientHeight??600;const maxX=Math.max(0,(z-1)*w/2);const maxY=Math.max(0,(z-1)*h/2);return{x:Math.max(-maxX,Math.min(maxX,x)),y:Math.max(-maxY,Math.min(maxY,y)),zoom:z};};const beginPan=(e:React.PointerEvent<HTMLDivElement>)=>{if(e.button!==0)return;e.currentTarget.setPointerCapture(e.pointerId);setDrag({x:e.clientX,y:e.clientY,ox:view.x,oy:view.y});};const pan=(e:React.PointerEvent<HTMLDivElement>)=>{if(!drag)return;const x=drag.ox+(e.clientX-drag.x);const y=drag.oy+(e.clientY-drag.y);setView(v=>clampView(x,y,v.zoom));};const endPan=()=>setDrag(null);const zoom=(delta:number)=>setView(v=>{const z=Math.max(1,Math.min(1.8,Number((v.zoom+delta).toFixed(2))));return clampView(v.x,v.y,z);});const resetView=()=>setView({x:0,y:0,zoom:1});"
          if old not in s:
              raise SystemExit('camera block not found')
          s = s.replace(old, new, 1)
          s = s.replace('<div className={`map ${drag?"panning":""}`} ', '<div ref={mapRef} className={`map ${drag?"panning":""}`} ', 1)
          page.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          c += r'''

/* EMERGE WORLD UI REDESIGN — painterly frontier / living civilization */
:root{--emerald:#8df36d;--emerald2:#43c968;--ink:#07110b;--panel:#0b1710e8;--line:#456b4b;--gold:#e7c978;--text:#e9f1df;--muted:#91a28e}
html,body{background:#050b07}
body{image-rendering:auto}
.shell{min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#355c36 0,#122619 34%,#07110b 72%,#040806 100%);color:var(--text)}
.shell:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;background-image:radial-gradient(#d9ffbd 0.6px,transparent .7px);background-size:5px 5px;mix-blend-mode:soft-light}
.topbar{height:92px;padding:0 32px;border-bottom:1px solid #54764e;background:linear-gradient(180deg,#08150ce8,#07100be8);box-shadow:0 8px 30px #0009;z-index:40}
.brand{gap:14px}.mark{width:48px;height:48px;border-radius:50% 50% 50% 12px;border:1px solid #8cf56c;background:radial-gradient(circle,#4fba57,#17391f 72%);box-shadow:0 0 22px #62e85b55, inset 0 0 18px #b7ff8b22;font-size:24px}.wordmark{font-size:25px;letter-spacing:6px;color:#a4ff7b;text-shadow:0 0 16px #75ff5b77}.tagline{font-size:10px;color:#91b08c;letter-spacing:1.6px;text-transform:uppercase}
.topstats{gap:10px;font-size:9px}.topstats>span{border:1px solid #29462f;background:#0c1a10;border-radius:999px;padding:8px 11px;color:#a5bd9e}.topstats .climate{color:#c8dca9}.topstats button{border:1px solid #5b844f;background:#102015;color:#bff2a3;border-radius:999px;padding:8px 14px}
.layout{grid-template-columns:226px minmax(0,1fr);min-height:calc(100vh - 92px);position:relative;z-index:1}.sidebar{border-right:1px solid #35563a;padding:28px 16px;background:linear-gradient(180deg,#07130be8,#08120de8);box-shadow:10px 0 30px #0005}.owner{border-bottom:1px solid #29432f;padding:0 12px 24px;color:#6f896d}.ownername{font-size:21px;color:#dff6cb;text-shadow:0 0 10px #70d85b33}.terrain{color:#80dc68}.sidebar nav button{border:1px solid transparent;border-radius:10px;color:#7f9980;padding:13px 14px;letter-spacing:.5px}.sidebar nav button:hover{background:#14291a;color:#c7edb2;border-color:#345c39}.sidebar nav button.active{background:linear-gradient(90deg,#18331c,#0f2115);border-color:#4f7d4b;color:#d5f6bf;box-shadow:inset 3px 0 #8df36d,0 4px 16px #0005}.speed button{border-radius:999px}.speed button.sel{background:#183a1d;box-shadow:0 0 12px #6ee85b44}.online{font-weight:700}
.content{max-width:none;padding:26px 28px 34px}.hero{margin-bottom:18px;padding:2px 4px}.eyebrow{color:#8be86d}.hero h1{font-size:32px;color:#eff8e6;text-shadow:0 2px 12px #000}.hero p{color:#81977e}.treasury{border:1px solid #476a45;background:#0b1710c9;padding:11px 16px;border-radius:12px;box-shadow:inset 0 1px #9ee27c22,0 8px 22px #0006}.treasury span{color:#7e9c77}.treasury strong{color:#e9f5d8}
.worldview{grid-template-columns:minmax(0,1fr) 292px;gap:16px}.map,.panel{border:1px solid #476849;border-radius:14px;background:linear-gradient(145deg,#0d1c12ed,#07110ce8);box-shadow:0 12px 34px #0008,inset 0 1px #d8ffb812}.map{height:min(650px,calc(100vh - 270px));min-height:500px;background:#17341e;touch-action:none;cursor:grab;isolation:isolate}.map.panning{cursor:grabbing}
.map:before{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;border-radius:14px;background:radial-gradient(ellipse at center,transparent 42%,#0310081f 72%,#020805a8 100%),linear-gradient(180deg,#d5ffb00b,transparent 25%,transparent 75%,#02080455)}
.map:after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;border-radius:14px;opacity:.22;background-image:radial-gradient(#efffcf 0.45px,transparent .65px);background-size:4px 4px;mix-blend-mode:overlay}
.mapstage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;transform-origin:center center!important;will-change:transform!important;overflow:visible!important}
.mapstage .terrainbg{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:grid!important;grid-template-columns:repeat(16,1fr)!important;grid-template-rows:repeat(12,1fr)!important;gap:2px;padding:2px;background:#173a21!important;filter:saturate(1.15) contrast(1.04)}
.terrainbg span{border:0!important;border-radius:4px;box-shadow:inset 0 1px #ffffff0b,inset 0 -5px 10px #06120835;position:relative;overflow:hidden}.terrainbg span:after{content:"";position:absolute;inset:12% 16%;opacity:.24;background:radial-gradient(circle at 20% 20%,#b7e48c 0 1px,transparent 1.5px),radial-gradient(circle at 70% 65%,#0a2410 0 1px,transparent 1.5px);background-size:11px 9px}.terrainbg .grass{background:linear-gradient(135deg,#285b31,#1c4828)!important}.terrainbg .meadow{background:linear-gradient(135deg,#3b7437,#285d2e)!important}.terrainbg .brush{background:linear-gradient(145deg,#275c30,#396c35)!important}.terrainbg .foresttile{background:linear-gradient(135deg,#153e25,#20552a)!important}.terrainbg .rocktile{background:linear-gradient(145deg,#4d5a48,#364637)!important}.terrainbg .soil{background:linear-gradient(135deg,#715738,#4d3d28)!important}.terrainbg .pathgrass{background:linear-gradient(135deg,#3a6838,#4a7540)!important}
.roads{z-index:2!important}.roads path{stroke:#e7c77b66!important;stroke-width:2.3!important;filter:drop-shadow(0 2px 2px #0009)}.roads path:first-child{stroke:#f4dda477!important}
.maplabel{top:15px;left:16px;border:1px solid #527b4e;background:#07130de8;color:#b8d6a8;border-radius:999px;padding:7px 11px;box-shadow:0 6px 16px #0006}.maplabel i{color:#86ed68}.weatherbadge{top:15px;right:16px;border:1px solid #52734c;background:#07130de8;border-radius:999px;box-shadow:0 6px 16px #0006}.weatherbadge span{color:#cde99e}.maplegend{top:64px;right:16px;background:#07130ddc;border:1px solid #456445;border-radius:999px;color:#a7bd9f}.mapcaption{bottom:14px;left:16px;right:16px;border:1px solid #39583d;background:#07120de0;color:#b7c8ae;border-radius:10px;box-shadow:0 8px 18px #0007}.maphint{bottom:60px;background:#07130dcf;border:1px solid #3d5e40;color:#8fae89;border-radius:999px}
.mapcontrols{right:16px;bottom:58px;background:#07130de8;border:1px solid #4b6f48;border-radius:11px;box-shadow:0 8px 18px #0008}.mapcontrols button{width:30px;height:28px;border:1px solid #2f4d33;background:#112217;color:#c7e6b5;border-radius:7px}.mapcontrols button:hover{background:#1a3820;border-color:#73c55d}.mapcontrols span{color:#94b38d}
.building{width:58px;height:46px;border:1px solid #9a7a46;background:linear-gradient(145deg,#8c744d,#4c3e2b);border-radius:7px;box-shadow:0 8px 16px #000a,inset 0 1px #f4d99333;z-index:5;font-size:21px}.building:before{content:"";position:absolute;left:4px;right:4px;top:-10px;height:15px;border:1px solid #6f5b3b;background:linear-gradient(180deg,#5f533f,#29291f);transform:skewX(-18deg);border-radius:3px;box-shadow:0 2px 3px #0008}.building span{z-index:2;color:#d8f2b5;text-shadow:0 0 8px #8de26a55}.building.operating{box-shadow:0 0 0 1px #8de86d66,0 0 18px #64e95d22,0 8px 16px #000a}.building:hover{transform:translate(-50%,-50%) scale(1.08);filter:brightness(1.16)}.building .door{bottom:-1px;width:7px;height:7px}.building em{background:#8ae96d;color:#081108}.resource-node{border:1px solid #83b36a;background:#173b22cc;box-shadow:0 0 0 3px #17361f66,0 8px 16px #0009}.forest-node{color:#91df6b}.rock-node{background:#435044cc;color:#d0d6c5}.farm-node{background:#5b452acc;color:#e5bf77}.citizen{width:18px;height:18px;transition:left 55ms linear,top 55ms linear,transform 120ms ease-out!important;will-change:left,top,transform;z-index:7}.citizen span{width:12px;height:12px;border:2px solid #d5ffc5;background:#a4f77f;box-shadow:0 0 0 2px #17321d99,0 0 10px #85f06c66}.citizen.working span{background:#9af57d}.citizen.trading span{background:#f2d77c;box-shadow:0 0 10px #f2d77c88}.citizen:hover{transform:translate(-50%,-50%) scale(1.7)}
.panel{padding:20px}.needs{background:linear-gradient(160deg,#0b1a10f5,#07110ce8)}.panel h3{color:#91b288}.stat{border-top:1px solid #29412d}.stat strong{color:#dcefd1;font-size:24px}.stat small{color:#71866e}.miniweather{border-top:1px solid #29412d}.lower{gap:16px;margin-top:16px}.resource{background:#0a1710;border-color:#29422e;border-radius:9px}.resource b{color:#d9efcf}.log div{border-color:#253c2a}.big{background:linear-gradient(145deg,#0d1b11,#07100b)}.bankcards div,.marketfeatured>div,.buildcard{background:#0a1710;border-color:#2d4931}.primary{background:linear-gradient(180deg,#a1f27b,#58c95e);box-shadow:0 8px 18px #4bcf5d33}.marketrow:hover,.marketrow.focused{background:#122619}.buildcard button{border-color:#3c5c40;background:#102016;color:#b7d5ac}.buildicon{background:#17371c;color:#94eb71}
@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.content{padding:20px}.worldview{grid-template-columns:1fr}.needs{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.needs h3,.miniweather{grid-column:1/-1}.topstats>span:first-child{display:none}}
@media(max-width:760px){.topbar{height:auto;min-height:78px;padding:12px 16px}.tagline{display:none}.topstats{gap:6px}.topstats>span:nth-child(2),.topstats .climate{display:none}.layout{grid-template-columns:1fr}.sidebar{display:none}.content{padding:16px}.hero h1{font-size:25px}.worldview{grid-template-columns:1fr}.map{height:65vh;min-height:420px}.lower{grid-template-columns:1fr}.buildgrid{grid-template-columns:repeat(2,1fr)}}
'''
          css.write_text(c)
          PY
      - name: Verify production build
        run: |
          npm ci
          npm run build
      - name: Commit redesign
        run: |
          git config user.name "Emerge UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Redesign Emerge world UI and bound map camera [skip-redesign]" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/redesign-emerge.yml
          git commit -m "Remove one-time Emerge redesign workflow [skip-redesign]"
          git push
