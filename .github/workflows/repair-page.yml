name: Repair page duplicate state
on:
  push:
    branches: [main]
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[auto-repair]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate inspector declarations and renders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()
          state=re.escape("const [inspected,setInspected]=useState<{kind:'citizen'|'building';id:string}|null>(null);")
          s=re.sub(r'(?:'+state+r'){2,}', "const [inspected,setInspected]=useState<{kind:'citizen'|'building';id:string}|null>(null);", s)
          render=re.escape('{inspected&&<Inspector world={world} inspected={inspected} onClose={()=>setInspected(null)}/> }')
          s=re.sub(r'(?:'+render+r'){2,}', '{inspected&&<Inspector world={world} inspected={inspected} onClose={()=>setInspected(null)}/> }', s)
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet || git commit -m "[auto-repair] Remove duplicate inspector declarations"
          git push
