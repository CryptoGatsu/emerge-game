name: Hard repair page
on:
  push:
    branches: [main]
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[hard-repair]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair page source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()

          # Remove every duplicate Inspector state declaration, then add exactly one.
          state="const [inspected,setInspected]=useState<{kind:'citizen'|'building';id:string}|null>(null);"
          s=s.replace(state,'')
          anchor="const [marketFocus,setMarketFocus]=useState<Resource>('wheat');"
          if anchor not in s:
              raise SystemExit('marketFocus anchor missing')
          s=s.replace(anchor,anchor+state,1)

          # Remove duplicated map state declarations and install exactly one pair.
          s=re.sub(r"const \[view,setView\]=useState\(\{x:0,y:0,zoom:1\}\);",'',s)
          s=re.sub(r"const \[drag,setDrag\]=useState<\{x:number;y:number;ox:number;oy:number\}\|null>\(null\);",'',s)
          s=s.replace(state,state+"const [view,setView]=useState({x:0,y:0,zoom:1});const [drag,setDrag]=useState<{x:number;y:number;ox:number;oy:number}|null>(null);",1)

          # Replace the entire map interaction declaration run with one clean copy.
          pat=re.compile(r"const market=world\.buildings\.find\(b=>b\.type==='Market'\);.*?(?=\n return <main)",re.S)
          handler="const market=world.buildings.find(b=>b.type==='Market');const beginPan=(e:React.PointerEvent<HTMLDivElement>)=>{if(e.button!==0)return;e.currentTarget.setPointerCapture(e.pointerId);setDrag({x:e.clientX,y:e.clientY,ox:view.x,oy:view.y});};const pan=(e:React.PointerEvent<HTMLDivElement>)=>{if(!drag)return;setView(v=>({...v,x:drag.ox+(e.clientX-drag.x),y:drag.oy+(e.clientY-drag.y)}));};const endPan=()=>setDrag(null);const zoom=(delta:number)=>setView(v=>({...v,zoom:Math.max(.65,Math.min(2.2,Number((v.zoom+delta).toFixed(2))))}));const resetView=()=>setView({x:0,y:0,zoom:1});"
          if not pat.search(s):
              raise SystemExit('map handler anchor missing')
          s=pat.sub(handler,s,count=1)

          # Keep only the first Inspector component. It is the final component in page.tsx.
          starts=[m.start() for m in re.finditer(r'^function Inspector\(',s,re.M)]
          if len(starts)>1:
              s=s[:starts[1]]

          # Keep only one Inspector render.
          render=re.compile(r'\{inspected&&<Inspector world=\{world\} inspected=\{inspected\} onClose=\{\(\)=>setInspected\(null\)\}/>\s*\}')
          ms=list(render.finditer(s))
          if len(ms)>1:
              first_end=ms[0].end()
              tail=s[first_end:]
              tail=render.sub('',tail)
              s=s[:first_end]+tail

          # Safety assertions before commit.
          if s.count(state)!=1:
              raise SystemExit(f'inspected state count={s.count(state)}')
          if len(re.findall(r'^function Inspector\(',s,re.M))!=1:
              raise SystemExit('Inspector function count is not 1')
          if s.count('const beginPan=')!=1:
              raise SystemExit(f'beginPan count={s.count("const beginPan=")}')
          p.write_text(s)
          PY
      - name: Validate production build
        run: |
          npm install
          npm run build
      - name: Commit repaired source and remove this workflow
        run: |
          rm -f .github/workflows/hard-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/hard-repair.yml
          git commit -m "[hard-repair] Fix duplicate page declarations"
          git push
