name: Polish Emerge roads
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply road polish
        run: node scripts/polish-roads.js
      - name: Build
        run: npm install && npm run build
      - name: Commit and remove repair files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/globals.css scripts/polish-roads.js .github/workflows/polish-roads.yml
          git commit -m "Polish settlement roads"
          git push
          git rm scripts/polish-roads.js .github/workflows/polish-roads.yml
          git commit -m "Remove one-time road polish workflow"
          git push
